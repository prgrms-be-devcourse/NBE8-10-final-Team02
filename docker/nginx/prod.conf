# 1. HTTP -> HTTPS 리다이렉트 및 Certbot 인증
server {
    listen 80;
    server_name your-domain.com; # 변호사님의 실제 도메인으로 수정

    # [추가] Certbot 인증을 위한 경로 (인증서 자동 갱신용)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 나머지 모든 요청은 HTTPS로 강제 이동
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS 설정 (실제 서비스)
server {
    listen 443 ssl;
    server_name your-domain.com;

    # 인증서 경로 (docker-compose의 볼륨 마운트 경로와 일치해야 함)
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # 보안 최적화 설정
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 프론트엔드 (Next.js) - [수정] fe_a를 바라보게 설정
    location / {
        proxy_pass http://fe_a:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 백엔드 API (Spring Boot) - [수정] be_a를 바라보게 설정
    location /api {
        proxy_pass http://be_a:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # [선택] 프로메테우스 수집 경로 보호
    location /actuator/prometheus {
        proxy_pass http://be_a:8080/actuator/prometheus;
        # 보안을 위해 특정 IP만 허용하거나 내부망에서만 접근하도록 하는 것이 좋습니다.
    }
}