version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prod-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-remote-write-receiver'
    volumes:
      - ./docker/prometheus-prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - global-net
    deploy: { resources: { limits: { memory: 256M } } }
    restart: always

  loki:
    image: grafana/loki:latest
    container_name: prod-loki
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - global-net
    deploy: { resources: { limits: { memory: 256M } } }
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: prod-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - global-net
    depends_on:
      - prometheus
      - loki
    deploy: { resources: { limits: { memory: 384M } } }
    restart: always

networks:
  global-net:
    external: true

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
