version: '3.8'

services:
  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: prod-npm
    restart: always
    ports:
      - '80:80'   # HTTP 접속 및 인증용
      - '443:443' # HTTPS 접속용
      - '81:81'   # NPM 관리자 대시보드 (여기서 SSL 설정을 합니다)
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ./docker/npm/data:/data
      - ./docker/npm/letsencrypt:/etc/letsencrypt
    networks:
      - global-net

